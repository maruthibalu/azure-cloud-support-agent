name: Azure Infra and App CI/CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      azure_location:
        description: Azure region (for example, eastus)
        required: false
        default: swedencentral
      resource_group:
        description: Resource group name
        required: false
        default: rg-cloud-agent-dev
      environment_name:
        description: Environment label passed to Bicep
        required: false
        default: dev
      acr_name:
        description: ACR name (must be globally unique, lowercase alphanumeric)
        required: false
        default: ''
      container_apps_env_name:
        description: Container Apps environment name
        required: false
        default: cae-cloud-agent
      container_app_name:
        description: Container App name
        required: false
        default: ca-cloud-agent-ui
      log_analytics_name:
        description: Log Analytics workspace name
        required: false
        default: law-cloud-agent
      openai_account_name:
        description: Azure OpenAI account name
        required: false
        default: ''
      azure_openai_deployment:
        description: Azure OpenAI deployment name for the app
        required: false
        default: ''
      azure_openai_api_version:
        description: Optional Azure OpenAI API version
        required: false
        default: 2025-04-01-preview

permissions:
  id-token: write
  contents: read

env:
  PYTHON_VERSION: '3.13'
  IMAGE_NAME: cloud-agent-ui
  AZURE_LOCATION: ${{ github.event.inputs.azure_location || vars.AZURE_LOCATION || 'swedencentral' }}
  AZURE_RESOURCE_GROUP: ${{ github.event.inputs.resource_group || vars.AZURE_RESOURCE_GROUP || 'rg-cloud-agent-dev' }}
  ENVIRONMENT_NAME: ${{ github.event.inputs.environment_name || vars.ENVIRONMENT_NAME || 'dev' }}
  ACR_NAME_OVERRIDE: ${{ github.event.inputs.acr_name || '' }}
  CONTAINER_APPS_ENV_NAME: ${{ github.event.inputs.container_apps_env_name || vars.CONTAINER_APPS_ENV_NAME || 'cae-cloud-agent' }}
  CONTAINER_APP_NAME: ${{ github.event.inputs.container_app_name || vars.CONTAINER_APP_NAME || 'ca-cloud-agent-ui' }}
  LOG_ANALYTICS_NAME: ${{ github.event.inputs.log_analytics_name || vars.LOG_ANALYTICS_NAME || 'law-cloud-agent' }}
  OPENAI_ACCOUNT_NAME_OVERRIDE: ${{ github.event.inputs.openai_account_name || vars.OPENAI_ACCOUNT_NAME || '' }}
  AZURE_OPENAI_DEPLOYMENT: ${{ github.event.inputs.azure_openai_deployment || vars.AZURE_OPENAI_DEPLOYMENT || 'gpt-4o-mini' }}
  AZURE_OPENAI_API_VERSION: ${{ github.event.inputs.azure_openai_api_version || vars.AZURE_OPENAI_API_VERSION || '2025-04-01-preview' }}

jobs:
  ci_tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: |
          python tests/test_agent_flow.py

  deploy_infrastructure:
    runs-on: ubuntu-latest
    needs: ci_tests
    outputs:
      acr_name: ${{ steps.set_outputs.outputs.acr_name }}
      container_app_name: ${{ steps.set_outputs.outputs.container_app_name }}
      resource_group: ${{ steps.set_outputs.outputs.resource_group }}
      openai_account_name: ${{ steps.set_outputs.outputs.openai_account_name }}
      openai_deployment: ${{ steps.set_outputs.outputs.openai_deployment }}
      openai_api_version: ${{ steps.set_outputs.outputs.openai_api_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Azure Container Apps CLI
        run: |
          az extension add --name containerapp --upgrade --yes
          az provider register --namespace Microsoft.App
          az provider register --namespace Microsoft.OperationalInsights
          az provider register --namespace Microsoft.CognitiveServices

      - name: Resolve deployment names
        id: naming
        shell: bash
        run: |
          ACR_FROM_PARAMS="$(python -c "import json; print(json.load(open('infra/main.parameters.json', encoding='utf-8')).get('parameters', {}).get('acrName', {}).get('value', ''))")"
          OPENAI_ACCOUNT_FROM_PARAMS="$(python -c "import json; print(json.load(open('infra/main.parameters.json', encoding='utf-8')).get('parameters', {}).get('openAiAccountName', {}).get('value', ''))")"
          OPENAI_DEPLOYMENT_FROM_PARAMS="$(python -c "import json; print(json.load(open('infra/main.parameters.json', encoding='utf-8')).get('parameters', {}).get('openAiDeploymentName', {}).get('value', ''))")"
          OPENAI_API_VERSION_FROM_PARAMS="$(python -c "import json; print(json.load(open('infra/main.parameters.json', encoding='utf-8')).get('parameters', {}).get('openAiApiVersion', {}).get('value', ''))")"

          if [ -n "${{ env.ACR_NAME_OVERRIDE }}" ] && [ "${{ env.ACR_NAME_OVERRIDE }}" != "replacewithuniquename" ]; then
            ACR_NAME="${{ env.ACR_NAME_OVERRIDE }}"
          elif [ -n "$ACR_FROM_PARAMS" ]; then
            ACR_NAME="$ACR_FROM_PARAMS"
          else
            RAW_NAME="${GITHUB_REPOSITORY_OWNER}${GITHUB_REPOSITORY#*/}${GITHUB_RUN_ID}"
            ACR_NAME="$(echo "$RAW_NAME" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9' | cut -c1-50)"
          fi

          # Normalize to Azure ACR constraints: lowercase alphanumeric only, 5-50 chars.
          ACR_NAME="$(echo "$ACR_NAME" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9' | cut -c1-50)"

          if [ "$ACR_NAME" = "replacewithuniquename" ] || [ -z "$ACR_NAME" ]; then
            echo "Invalid ACR name resolved: '$ACR_NAME'. Set infra/main.parameters.json parameters.acrName.value or workflow input acr_name."
            exit 1
          fi
          if ! [[ "$ACR_NAME" =~ ^[a-z0-9]{5,50}$ ]]; then
            echo "Invalid ACR format '$ACR_NAME'. Must match ^[a-z0-9]{5,50}$"
            exit 1
          fi
          echo "Resolved ACR name: $ACR_NAME"

          if [ -n "${{ env.OPENAI_ACCOUNT_NAME_OVERRIDE }}" ]; then
            OPENAI_ACCOUNT_NAME="${{ env.OPENAI_ACCOUNT_NAME_OVERRIDE }}"
          elif [ -n "$OPENAI_ACCOUNT_FROM_PARAMS" ]; then
            OPENAI_ACCOUNT_NAME="$OPENAI_ACCOUNT_FROM_PARAMS"
          else
            RAW_OPENAI="${GITHUB_REPOSITORY_OWNER}${GITHUB_REPOSITORY#*/}openai${GITHUB_RUN_ID}"
            OPENAI_ACCOUNT_NAME="$(echo "$RAW_OPENAI" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9-' | cut -c1-64)"
          fi

          if [ -n "$OPENAI_DEPLOYMENT_FROM_PARAMS" ]; then
            OPENAI_DEPLOYMENT_NAME="$OPENAI_DEPLOYMENT_FROM_PARAMS"
          else
            OPENAI_DEPLOYMENT_NAME="${{ env.AZURE_OPENAI_DEPLOYMENT }}"
          fi

          if [ -n "$OPENAI_API_VERSION_FROM_PARAMS" ]; then
            OPENAI_API_VERSION="$OPENAI_API_VERSION_FROM_PARAMS"
          else
            OPENAI_API_VERSION="${{ env.AZURE_OPENAI_API_VERSION }}"
          fi

          echo "acr_name=$ACR_NAME" >> "$GITHUB_OUTPUT"
          echo "openai_account_name=$OPENAI_ACCOUNT_NAME" >> "$GITHUB_OUTPUT"
          echo "openai_deployment=$OPENAI_DEPLOYMENT_NAME" >> "$GITHUB_OUTPUT"
          echo "openai_api_version=$OPENAI_API_VERSION" >> "$GITHUB_OUTPUT"

      - name: Ensure resource group exists
        run: |
          az group create \
            --name "${{ env.AZURE_RESOURCE_GROUP }}" \
            --location "${{ env.AZURE_LOCATION }}"

      - name: Deploy infrastructure (Bicep)
        run: |
          az deployment group create \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters \
              location="${{ env.AZURE_LOCATION }}" \
              environmentName="${{ env.ENVIRONMENT_NAME }}" \
              acrName="${{ steps.naming.outputs.acr_name }}" \
              containerAppsEnvironmentName="${{ env.CONTAINER_APPS_ENV_NAME }}" \
              containerAppName="${{ env.CONTAINER_APP_NAME }}" \
              logAnalyticsWorkspaceName="${{ env.LOG_ANALYTICS_NAME }}" \
              openAiAccountName="${{ steps.naming.outputs.openai_account_name }}" \
              openAiLocation="eastus" \
              openAiDeploymentName="${{ steps.naming.outputs.openai_deployment }}" \
              openAiApiVersion="${{ steps.naming.outputs.openai_api_version }}"

      - name: Set workflow outputs
        id: set_outputs
        run: |
          echo "acr_name=${{ steps.naming.outputs.acr_name }}" >> $GITHUB_OUTPUT
          echo "container_app_name=${{ env.CONTAINER_APP_NAME }}" >> $GITHUB_OUTPUT
          echo "resource_group=${{ env.AZURE_RESOURCE_GROUP }}" >> $GITHUB_OUTPUT
          echo "openai_account_name=${{ steps.naming.outputs.openai_account_name }}" >> $GITHUB_OUTPUT
          echo "openai_deployment=${{ steps.naming.outputs.openai_deployment }}" >> $GITHUB_OUTPUT
          echo "openai_api_version=${{ steps.naming.outputs.openai_api_version }}" >> $GITHUB_OUTPUT

      - name: Diagnostics banner (deploy_infrastructure)
        run: |
          echo "=== Workflow Diagnostics ==="
          echo "job=deploy_infrastructure"
          echo "run_id=${{ github.run_id }}"
          echo "sha=${{ github.sha }}"
          echo "ref=${{ github.ref }}"
          echo "resolved_acr=${{ steps.naming.outputs.acr_name }}"
          echo "resource_group=${{ env.AZURE_RESOURCE_GROUP }}"
          echo "============================"

  build_and_deploy_app:
    runs-on: ubuntu-latest
    needs: deploy_infrastructure

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Azure Container Apps CLI
        run: |
          az extension add --name containerapp --upgrade --yes

      - name: Diagnostics banner (build_and_deploy_app)
        run: |
          echo "=== Workflow Diagnostics ==="
          echo "job=build_and_deploy_app"
          echo "run_id=${{ github.run_id }}"
          echo "sha=${{ github.sha }}"
          echo "ref=${{ github.ref }}"
          echo "resolved_acr=${{ needs.deploy_infrastructure.outputs.acr_name }}"
          echo "container_app=${{ needs.deploy_infrastructure.outputs.container_app_name }}"
          echo "============================"

      - name: Preflight ACR access check
        shell: bash
        run: |
          set -euo pipefail
          ACR_NAME="${{ needs.deploy_infrastructure.outputs.acr_name }}"
          echo "Preflight using ACR name: $ACR_NAME"

          echo "Validating ACR exists: $ACR_NAME"
          if ! ACR_ID="$(az acr show --name "$ACR_NAME" --query id -o tsv)"; then
            echo "ACR '$ACR_NAME' was not found or is not accessible in this subscription."
            echo "Check that the name is correct and the workflow is targeting the correct subscription."
            exit 1
          fi

          echo "Validating Docker auth to ACR"
          if ! az acr login --name "$ACR_NAME"; then
            echo "ACR login failed. This usually means missing AcrPush/AcrPull permissions for the OIDC service principal."
            echo "Grant required role (run as owner/admin):"
            echo "az role assignment create --assignee ${{ secrets.AZURE_CLIENT_ID }} --role AcrPush --scope $ACR_ID"
            exit 1
          fi

          echo "ACR preflight passed for '$ACR_NAME'."

      - name: Build and push image to ACR
        run: |
          docker build \
            -t "${{ needs.deploy_infrastructure.outputs.acr_name }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            -t "${{ needs.deploy_infrastructure.outputs.acr_name }}.azurecr.io/${{ env.IMAGE_NAME }}:latest" \
            .
          docker push "${{ needs.deploy_infrastructure.outputs.acr_name }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker push "${{ needs.deploy_infrastructure.outputs.acr_name }}.azurecr.io/${{ env.IMAGE_NAME }}:latest"

      - name: Update Container App image
        run: |
          az containerapp update \
            --name "${{ needs.deploy_infrastructure.outputs.container_app_name }}" \
            --resource-group "${{ needs.deploy_infrastructure.outputs.resource_group }}" \
            --image "${{ needs.deploy_infrastructure.outputs.acr_name }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}"

      - name: Resolve Azure OpenAI endpoint and key
        id: openai
        shell: bash
        run: |
          set -euo pipefail
          OPENAI_ACCOUNT_NAME="${{ needs.deploy_infrastructure.outputs.openai_account_name }}"
          RESOURCE_GROUP="${{ needs.deploy_infrastructure.outputs.resource_group }}"

          OPENAI_ENDPOINT="$(az cognitiveservices account show --name "$OPENAI_ACCOUNT_NAME" --resource-group "$RESOURCE_GROUP" --query properties.endpoint -o tsv)"
          OPENAI_KEY="$(az cognitiveservices account keys list --name "$OPENAI_ACCOUNT_NAME" --resource-group "$RESOURCE_GROUP" --query key1 -o tsv)"

          if [ -z "$OPENAI_ENDPOINT" ] || [ -z "$OPENAI_KEY" ]; then
            echo "Failed to resolve Azure OpenAI endpoint/key for account '$OPENAI_ACCOUNT_NAME'."
            exit 1
          fi

          echo "::add-mask::$OPENAI_KEY"
          echo "openai_endpoint=$OPENAI_ENDPOINT" >> "$GITHUB_OUTPUT"
          echo "openai_key=$OPENAI_KEY" >> "$GITHUB_OUTPUT"

      - name: Set Azure OpenAI app settings
        run: |
          az containerapp update \
            --name "${{ needs.deploy_infrastructure.outputs.container_app_name }}" \
            --resource-group "${{ needs.deploy_infrastructure.outputs.resource_group }}" \
            --set-env-vars \
              AZURE_OPENAI_ENDPOINT='${{ steps.openai.outputs.openai_endpoint }}' \
              AZURE_OPENAI_API_KEY='${{ steps.openai.outputs.openai_key }}' \
              AZURE_OPENAI_DEPLOYMENT='${{ needs.deploy_infrastructure.outputs.openai_deployment }}' \
              AZURE_OPENAI_API_VERSION='${{ needs.deploy_infrastructure.outputs.openai_api_version }}'

      - name: Show Container App URL
        run: |
          az containerapp show \
            --name "${{ needs.deploy_infrastructure.outputs.container_app_name }}" \
            --resource-group "${{ needs.deploy_infrastructure.outputs.resource_group }}" \
            --query properties.configuration.ingress.fqdn -o tsv
