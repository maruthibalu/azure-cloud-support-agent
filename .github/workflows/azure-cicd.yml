name: Azure Infra and App CI/CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  PYTHON_VERSION: '3.13'
  IMAGE_NAME: cloud-agent-ui

jobs:
  ci_tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: |
          python tests/test_agent_flow.py

  deploy_infrastructure:
    runs-on: ubuntu-latest
    needs: ci_tests
    outputs:
      acr_name: ${{ steps.set_outputs.outputs.acr_name }}
      container_app_name: ${{ steps.set_outputs.outputs.container_app_name }}
      resource_group: ${{ steps.set_outputs.outputs.resource_group }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Azure Container Apps CLI
        run: |
          az extension add --name containerapp --upgrade --yes
          az provider register --namespace Microsoft.App
          az provider register --namespace Microsoft.OperationalInsights

      - name: Ensure resource group exists
        run: |
          az group create \
            --name "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --location "${{ secrets.AZURE_LOCATION }}"

      - name: Deploy infrastructure (Bicep)
        run: |
          az deployment group create \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters \
              location="${{ secrets.AZURE_LOCATION }}" \
              environmentName="${{ secrets.ENVIRONMENT_NAME }}" \
              acrName="${{ secrets.ACR_NAME }}" \
              containerAppsEnvironmentName="${{ secrets.CONTAINER_APPS_ENV_NAME }}" \
              containerAppName="${{ secrets.CONTAINER_APP_NAME }}" \
              logAnalyticsWorkspaceName="${{ secrets.LOG_ANALYTICS_NAME }}"

      - name: Set workflow outputs
        id: set_outputs
        run: |
          echo "acr_name=${{ secrets.ACR_NAME }}" >> $GITHUB_OUTPUT
          echo "container_app_name=${{ secrets.CONTAINER_APP_NAME }}" >> $GITHUB_OUTPUT
          echo "resource_group=${{ secrets.AZURE_RESOURCE_GROUP }}" >> $GITHUB_OUTPUT

  build_and_deploy_app:
    runs-on: ubuntu-latest
    needs: deploy_infrastructure

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Azure Container Apps CLI
        run: |
          az extension add --name containerapp --upgrade --yes

      - name: Build and push image to ACR
        run: |
          az acr build \
            --registry "${{ needs.deploy_infrastructure.outputs.acr_name }}" \
            --image "${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            --image "${{ env.IMAGE_NAME }}:latest" \
            .

      - name: Update Container App image
        run: |
          az containerapp update \
            --name "${{ needs.deploy_infrastructure.outputs.container_app_name }}" \
            --resource-group "${{ needs.deploy_infrastructure.outputs.resource_group }}" \
            --image "${{ needs.deploy_infrastructure.outputs.acr_name }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}"

      - name: Set Azure OpenAI app settings
        run: |
          az containerapp update \
            --name "${{ needs.deploy_infrastructure.outputs.container_app_name }}" \
            --resource-group "${{ needs.deploy_infrastructure.outputs.resource_group }}" \
            --set-env-vars \
              AZURE_OPENAI_ENDPOINT='${{ secrets.AZURE_OPENAI_ENDPOINT }}' \
              AZURE_OPENAI_API_KEY='${{ secrets.AZURE_OPENAI_API_KEY }}' \
              AZURE_OPENAI_DEPLOYMENT='${{ secrets.AZURE_OPENAI_DEPLOYMENT }}' \
              AZURE_OPENAI_API_VERSION='${{ secrets.AZURE_OPENAI_API_VERSION }}'

      - name: Show Container App URL
        run: |
          az containerapp show \
            --name "${{ needs.deploy_infrastructure.outputs.container_app_name }}" \
            --resource-group "${{ needs.deploy_infrastructure.outputs.resource_group }}" \
            --query properties.configuration.ingress.fqdn -o tsv
